name: CD - Continuous Deployment

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:

env:
  SWIFT_VERSION: '6.0'
  APP_NAME: 'ClaudeSpotlight'

jobs:
  deploy-development:
    name: Deploy Development Build
    runs-on: macos-15
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'
      
      - name: Get commit info
        id: commit
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty=%B | head -n1)" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Build .app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      
      - name: Create development archive
        run: |
          cd .build
          zip -r ../ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}.zip ClaudeSpotlight.app
          cd ..
      
      - name: Generate build info
        run: |
          cat > build-info.txt << EOF
          ClaudeSpotlight Development Build
          ==================================
          Build Date: ${{ steps.commit.outputs.DATE }}
          Commit: ${{ steps.commit.outputs.SHORT_SHA }}
          Branch: ${GITHUB_REF#refs/heads/}
          Message: ${{ steps.commit.outputs.COMMIT_MSG }}
          
          Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat build-info.txt
      
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}
          path: |
            ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}.zip
            build-info.txt
          retention-days: 30
      
      - name: Create or update development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Development Build (Latest)
          body: |
            ## 🚀 Development Build - Latest from ${{ github.ref_name }}
            
            **Auto-generated development build from latest commit**
            
            ### Build Information
            - **Commit:** ${{ steps.commit.outputs.SHORT_SHA }}
            - **Date:** ${{ steps.commit.outputs.DATE }}
            - **Message:** ${{ steps.commit.outputs.COMMIT_MSG }}
            - **Branch:** ${{ github.ref_name }}
            
            ### ⚠️ Development Build Warning
            This is an automated development build from the latest commit. It may contain:
            - Unreleased features
            - Experimental code
            - Potential bugs
            - Breaking changes
            
            **For stable releases, use tagged versions (v1.0.0, etc.)**
            
            ### Installation
            1. Download `ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}.zip`
            2. Extract and move to Applications folder
            3. Set `ANTHROPIC_API_KEY` environment variable
            4. Launch and use **⌘⇧Space** to invoke
            
            ### Requirements
            - macOS 15.0 (Sequoia) or later
            - Anthropic API key
            
            ---
            🤖 *This release is automatically updated with each push to ${{ github.ref_name }}*
          files: |
            ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}.zip
            build-info.txt
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Development build deployed successfully!"
          echo "📦 Artifact: ClaudeSpotlight-dev-${{ steps.commit.outputs.SHORT_SHA }}.zip"
          echo "🏷️  Release: dev-latest"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [deploy-development]
    if: failure()
    
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CD Deployment Failed - ${context.sha.substring(0, 7)}`,
              body: `## ❌ Continuous Deployment Failed
              
              **Workflow Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              **Commit:** ${context.sha.substring(0, 7)}
              **Branch:** ${context.ref.replace('refs/heads/', '')}
              
              The continuous deployment workflow failed. Please check the workflow logs for details.
              
              ### Action Items
              - [ ] Review workflow logs
              - [ ] Fix any build errors
              - [ ] Re-run the workflow if needed
              
              ---
              🤖 *This issue was automatically created by the CD workflow*`,
              labels: ['bug', 'ci/cd', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);
